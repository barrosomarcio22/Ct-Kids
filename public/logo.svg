<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Filtro de sombra profunda para o emblema -->
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.85" />
    </filter>
    
    <!-- Filtro de sombra suave interna -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Gradiente Metálico Cromado (Letras IRON e Detalhes) -->
    <linearGradient id="chromeMetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#E5E7EB" />
      <stop offset="48%" stop-color="#9CA3AF" />
      <stop offset="52%" stop-color="#4B5563" />
      <stop offset="75%" stop-color="#D1D5DB" />
      <stop offset="100%" stop-color="#374151" />
    </linearGradient>

    <!-- Gradiente de Borda Prateada Externa -->
    <linearGradient id="silverBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5E7EB" />
      <stop offset="30%" stop-color="#9CA3AF" />
      <stop offset="70%" stop-color="#4B5563" />
      <stop offset="100%" stop-color="#D1D5DB" />
    </linearGradient>

    <!-- Gradiente Vermelho Sangue Oficial -->
    <linearGradient id="bloodRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EF141E" />
      <stop offset="50%" stop-color="#C80C14" />
      <stop offset="100%" stop-color="#96050C" />
    </linearGradient>

    <!-- Gradiente de Anilhas de Ferro (Dark Metallic Plate) -->
    <linearGradient id="plateMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#18181B" />
      <stop offset="25%" stop-color="#3F3F46" />
      <stop offset="50%" stop-color="#27272A" />
      <stop offset="75%" stop-color="#52525B" />
      <stop offset="100%" stop-color="#18181B" />
    </linearGradient>

    <!-- Gradiente Fundo Hexágono -->
    <linearGradient id="hexBackground" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141418" />
      <stop offset="50%" stop-color="#09090B" />
      <stop offset="100%" stop-color="#040405" />
    </linearGradient>
  </defs>

  <!-- ==================== HALTERES LATERAIS (BARBELLS) ==================== -->
  <g id="barbell-left">
    <!-- Barra horizontal esquerda -->
    <rect x="68" y="227" width="60" height="12" rx="2" fill="url(#silverBorder)" stroke="#18181B" stroke-width="1.5" />
    
    <!-- Ponta / Trava da Barra -->
    <rect x="70" y="222" width="10" height="22" rx="2" fill="#27272A" stroke="#71717A" stroke-width="1" />
    
    <!-- Anilha Externa Pesada -->
    <rect x="80" y="182" width="14" height="102" rx="4" fill="url(#plateMetal)" stroke="#71717A" stroke-width="1.5" />
    <line x1="87" y1="186" x2="87" y2="280" stroke="#71717A" stroke-width="1" opacity="0.4" />
    
    <!-- Anilha Mediana -->
    <rect x="97" y="192" width="14" height="82" rx="3" fill="url(#plateMetal)" stroke="#71717A" stroke-width="1.5" />
    
    <!-- Anilha Interna -->
    <rect x="114" y="202" width="12" height="62" rx="2" fill="url(#plateMetal)" stroke="#52525B" stroke-width="1" />
    
    <!-- Trava / Presilha Interna -->
    <rect x="127" y="218" width="8" height="30" rx="2" fill="#52525B" stroke="#27272A" stroke-width="1" />
  </g>

  <g id="barbell-right">
    <!-- Barra horizontal direita -->
    <rect x="372" y="227" width="60" height="12" rx="2" fill="url(#silverBorder)" stroke="#18181B" stroke-width="1.5" />
    
    <!-- Trava / Presilha Interna -->
    <rect x="365" y="218" width="8" height="30" rx="2" fill="#52525B" stroke="#27272A" stroke-width="1" />
    
    <!-- Anilha Interna -->
    <rect x="374" y="202" width="12" height="62" rx="2" fill="url(#plateMetal)" stroke="#52525B" stroke-width="1" />
    
    <!-- Anilha Mediana -->
    <rect x="389" y="192" width="14" height="82" rx="3" fill="url(#plateMetal)" stroke="#71717A" stroke-width="1.5" />
    
    <!-- Anilha Externa Pesada -->
    <rect x="406" y="182" width="14" height="102" rx="4" fill="url(#plateMetal)" stroke="#71717A" stroke-width="1.5" />
    <line x1="413" y1="186" x2="413" y2="280" stroke="#71717A" stroke-width="1" opacity="0.4" />
    
    <!-- Ponta / Trava da Barra -->
    <rect x="420" y="222" width="10" height="22" rx="2" fill="#27272A" stroke="#71717A" stroke-width="1" />
  </g>

  <!-- ==================== HEXÁGONO CENTRAL ==================== -->
  <g filter="url(#badgeShadow)">
    <!-- Borda Prateada Chanfrada Externa -->
    <polygon points="250,70 388,154 388,312 250,396 112,312 112,154" 
             fill="#09090B" 
             stroke="url(#silverBorder)" 
             stroke-width="5" 
             stroke-linejoin="round" />

    <!-- Borda Vermelha Sangue -->
    <polygon points="250,78 381,159 381,307 250,388 119,307 119,159" 
             fill="none" 
             stroke="url(#bloodRed)" 
             stroke-width="4.5" 
             stroke-linejoin="round" />

    <!-- Fundo Interno Grafite Preto -->
    <polygon points="250,83 376,162 376,304 250,383 124,304 124,162" 
             fill="url(#hexBackground)" />
  </g>

  <!-- ==================== TOPO: CT + ESTRELAS + LINHA ==================== -->
  <!-- Estrela Prateada Esquerda -->
  <polygon points="194,153 197,160 204,160 198,164 200,171 194,167 188,171 190,164 184,160 191,160" 
           fill="url(#chromeMetal)" stroke="#374151" stroke-width="0.5" />

  <!-- Texto CT -->
  <text x="250" y="166" 
        font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" 
        font-weight="900" 
        font-size="44" 
        letter-spacing="2"
        fill="url(#bloodRed)" 
        text-anchor="middle"
        style="text-shadow: 0 2px 4px rgba(0,0,0,0.8);">CT</text>

  <!-- Estrela Prateada Direita -->
  <polygon points="306,153 309,160 316,160 310,164 312,171 306,167 300,171 302,164 296,160 303,160" 
           fill="url(#chromeMetal)" stroke="#374151" stroke-width="0.5" />

  <!-- Linha divisória superior com diamante -->
  <path d="M 172 178 L 243 178 L 250 175 L 257 178 L 328 178" 
        stroke="url(#silverBorder)" 
        stroke-width="1.5" 
        fill="none" 
        stroke-linecap="round" />
  <polygon points="250,175 253,178 250,181 247,178" fill="url(#chromeMetal)" />

  <!-- ==================== CENTRO: "IRON" 3D METÁLICO ==================== -->
  <!-- Sombra 3D das letras IRON -->
  <text x="252" y="260" 
        font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" 
        font-weight="900" 
        font-size="74" 
        letter-spacing="4"
        fill="#050507" 
        text-anchor="middle">IRON</text>
  
  <text x="251" y="259" 
        font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" 
        font-weight="900" 
        font-size="74" 
        letter-spacing="4"
        fill="#18181B" 
        text-anchor="middle">IRON</text>

  <!-- Letra Principal IRON em Cromo 3D com borda chanfrada -->
  <text x="250" y="257" 
        font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" 
        font-weight="900" 
        font-size="74" 
        letter-spacing="4"
        fill="url(#chromeMetal)" 
        stroke="#4B5563" 
        stroke-width="1.5"
        text-anchor="middle">IRON</text>

  <!-- ==================== CENTRO: "KINGS" VERMELHO SANGUE ==================== -->
  <!-- Sombra da palavra KINGS -->
  <text x="251" y="323" 
        font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" 
        font-weight="900" 
        font-size="60" 
        letter-spacing="2"
        fill="#000000" 
        text-anchor="middle">KINGS</text>

  <!-- Texto Principal KINGS -->
  <text x="250" y="321" 
        font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" 
        font-weight="900" 
        font-size="60" 
        letter-spacing="2"
        fill="url(#bloodRed)" 
        text-anchor="middle">KINGS</text>

  <!-- ==================== BASE: LINHA + COROA PRATEADA (REALEZA) ==================== -->
  <!-- Linha divisória inferior com diamante -->
  <path d="M 172 344 L 243 344 L 250 341 L 257 344 L 328 344" 
        stroke="url(#silverBorder)" 
        stroke-width="1.5" 
        fill="none" 
        stroke-linecap="round" />
  <polygon points="250,341 253,344 250,347 247,344" fill="url(#chromeMetal)" />

  <!-- Coroa Prateada dos Kings -->
  <g transform="translate(235, 352) scale(0.65)">
    <!-- Base da Coroa -->
    <path d="M 3 32 L 43 32 L 41 38 L 5 38 Z" fill="url(#chromeMetal)" stroke="#374151" stroke-width="0.8" />
    
    <!-- Pontas da Coroa -->
    <path d="M 5 32 L 1 14 L 13 23 L 23 6 L 33 23 L 45 14 L 41 32 Z" 
          fill="url(#chromeMetal)" 
          stroke="#4B5563" 
          stroke-width="1" />
    
    <!-- Pérolas nas 5 Pontas -->
    <circle cx="1" cy="13" r="2.2" fill="#FFFFFF" stroke="#6B7280" stroke-width="0.5" />
    <circle cx="13" cy="22" r="1.8" fill="#FFFFFF" stroke="#6B7280" stroke-width="0.5" />
    <circle cx="23" cy="5" r="2.8" fill="#FFFFFF" stroke="#6B7280" stroke-width="0.5" />
    <circle cx="33" cy="22" r="1.8" fill="#FFFFFF" stroke="#6B7280" stroke-width="0.5" />
    <circle cx="45" cy="13" r="2.2" fill="#FFFFFF" stroke="#6B7280" stroke-width="0.5" />

    <!-- Cristais da Base -->
    <circle cx="14" cy="35" r="1.2" fill="#D3121A" />
    <circle cx="23" cy="35" r="1.5" fill="#FFFFFF" />
    <circle cx="32" cy="35" r="1.2" fill="#D3121A" />
  </g>
</svg>
