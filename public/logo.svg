<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Filtro de Sombra Suave -->
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <!-- Gradiente do Fundo do Escudo -->
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#23272F" />
      <stop offset="50%" stop-color="#181B20" />
      <stop offset="100%" stop-color="#0F1115" />
    </linearGradient>

    <!-- Gradiente da Borda Prateada / Cromada -->
    <linearGradient id="silverBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#E2E8F0" />
      <stop offset="70%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>

    <!-- Gradiente da Pele do Menino -->
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFDFC4" />
      <stop offset="100%" stop-color="#F0B892" />
    </linearGradient>

    <!-- Gradiente do Cabelo Castanho -->
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8D4925" />
      <stop offset="50%" stop-color="#6B3416" />
      <stop offset="100%" stop-color="#4E240D" />
    </linearGradient>

    <!-- Gradiente da Camiseta Vermelha -->
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#881313" />
    </linearGradient>

    <!-- Gradiente Vermelho Anilhas e KIDS -->
    <linearGradient id="redGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF3B30" />
      <stop offset="50%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#9F1239" />
    </linearGradient>

    <!-- Gradiente Letras IRON (Branco 3D) -->
    <linearGradient id="ironTextGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="65%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <!-- Gradiente Letras KIDS (Vermelho 3D) -->
    <linearGradient id="kidsTextGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF4D4D" />
      <stop offset="50%" stop-color="#E60000" />
      <stop offset="100%" stop-color="#B30000" />
    </linearGradient>

    <!-- Gradiente da Coroa Prateada -->
    <linearGradient id="crownSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#E2E8F0" />
      <stop offset="80%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
  </defs>

  <g filter="url(#badgeShadow)">

    <!-- ========================================== -->
    <!-- 1. ESCUDO HEXAGONAL (BASE DO LOGO)         -->
    <!-- ========================================== -->
    <!-- Borda Externa Grossa Prateada/Preta com Chanfro -->
    <polygon points="320,105 470,195 470,410 320,500 170,410 170,195" 
             fill="url(#shieldBg)" 
             stroke="url(#silverBorder)" 
             stroke-width="16" 
             stroke-linejoin="round" />

    <!-- Borda Preta de Contorno Interno -->
    <polygon points="320,118 456,201 456,400 320,486 184,400 184,201" 
             fill="none" 
             stroke="#0B0D10" 
             stroke-width="8" 
             stroke-linejoin="round" />

    <!-- Filete Fino Branco/Prateado Interno -->
    <polygon points="320,126 446,206 446,394 320,474 194,394 194,206" 
             fill="none" 
             stroke="#FFFFFF" 
             stroke-width="3" 
             stroke-opacity="0.7" 
             stroke-linejoin="round" />

    <!-- ========================================== -->
    <!-- 2. MASCOTE: MENINO ATLETA (ESQUERDA)       -->
    <!-- ========================================== -->
    <g id="mascot">
      <!-- Corpo / Tronco / Camiseta Vermelha do Menino -->
      <path d="M 140 230 C 150 220 185 220 195 240 L 205 320 L 135 320 Z" 
            fill="url(#shirtGrad)" stroke="#1F242D" stroke-width="4" stroke-linejoin="round" />
      <!-- Gola da Camiseta -->
      <path d="M 152 230 C 165 242 178 242 186 232" fill="none" stroke="#991B1B" stroke-width="4" />

      <!-- Braço Esquerdo segurando o Haltere -->
      <!-- Antebraço -->
      <path d="M 145 255 C 130 260 115 285 130 305 C 142 320 160 300 165 280 Z" 
            fill="url(#skinGrad)" stroke="#1F242D" stroke-width="4" stroke-linejoin="round" />

      <!-- Mão segurando a barra do haltere -->
      <ellipse cx="138" cy="296" rx="14" ry="12" fill="url(#skinGrad)" stroke="#1F242D" stroke-width="3.5" />
      <path d="M 132 290 C 138 290 144 294 144 302" fill="none" stroke="#1F242D" stroke-width="2.5" />

      <!-- HALTERE INFANTIL (PESO VERMELHO E PRATA) -->
      <!-- Barra de Aço -->
      <rect x="65" y="285" width="130" height="12" rx="4" fill="url(#silverBorder)" stroke="#1F242D" stroke-width="3" />
      <!-- Anilha Externa Esquerda -->
      <rect x="68" y="248" width="20" height="86" rx="8" fill="url(#redGloss)" stroke="#1F242D" stroke-width="4" />
      <rect x="73" y="254" width="10" height="74" rx="4" fill="#FECDD3" opacity="0.4" />
      <!-- Colar Prateado Externo -->
      <rect x="88" y="260" width="8" height="62" rx="3" fill="url(#silverBorder)" stroke="#1F242D" stroke-width="2.5" />

      <!-- Anilha Interna Direita (Frente ao Corpo) -->
      <rect x="165" y="242" width="22" height="98" rx="8" fill="url(#redGloss)" stroke="#1F242D" stroke-width="4" />
      <rect x="170" y="248" width="10" height="86" rx="4" fill="#FECDD3" opacity="0.4" />
      <!-- Colar Prateado Interno -->
      <rect x="157" y="256" width="8" height="70" rx="3" fill="url(#silverBorder)" stroke="#1F242D" stroke-width="2.5" />

      <!-- Cabeça / Rosto do Menino -->
      <!-- Orelha Esquerda -->
      <circle cx="138" cy="195" r="13" fill="url(#skinGrad)" stroke="#1F242D" stroke-width="3.5" />
      <path d="M 136 191 C 140 193 140 198 136 200" fill="none" stroke="#E09B74" stroke-width="2" />

      <!-- Formato do Rosto (Fofinho / Bochechudo) -->
      <path d="M 144 180 C 144 145 185 140 200 150 C 215 160 220 185 218 205 C 215 235 160 240 148 215 C 144 205 144 190 144 180 Z" 
            fill="url(#skinGrad)" stroke="#1F242D" stroke-width="4" stroke-linejoin="round" />

      <!-- Cabelo Castanho Estilizado com Topete -->
      <path d="M 142 175 C 138 150 155 130 180 126 C 205 122 225 140 220 170 C 212 165 205 166 198 160 C 190 155 185 165 175 160 C 165 155 158 168 142 175 Z" 
            fill="url(#hairGrad)" stroke="#1F242D" stroke-width="4" stroke-linejoin="round" />
      <!-- Mecha de Destaque no Topete -->
      <path d="M 165 135 C 180 132 198 138 202 148" fill="none" stroke="#A05A32" stroke-width="3" stroke-linecap="round" />

      <!-- Sobrancelhas Expressivas e Amigáveis -->
      <path d="M 160 170 C 166 166 174 167 178 171" fill="none" stroke="#4E240D" stroke-width="3.5" stroke-linecap="round" />
      <path d="M 194 171 C 198 167 206 167 212 171" fill="none" stroke="#4E240D" stroke-width="3.5" stroke-linecap="round" />

      <!-- Olhos Grandes Cartoon Brilhantes -->
      <!-- Olho Esquerdo -->
      <ellipse cx="170" cy="184" rx="7.5" ry="9.5" fill="#2A1810" stroke="#1F242D" stroke-width="1.5" />
      <circle cx="172.5" cy="181" r="3" fill="#FFFFFF" />
      <circle cx="168" cy="187" r="1.2" fill="#FFFFFF" />

      <!-- Olho Direito -->
      <ellipse cx="202" cy="185" rx="7.5" ry="9.5" fill="#2A1810" stroke="#1F242D" stroke-width="1.5" />
      <circle cx="204.5" cy="182" r="3" fill="#FFFFFF" />
      <circle cx="200" cy="188" r="1.2" fill="#FFFFFF" />

      <!-- Narizinho Bonitinho -->
      <path d="M 186 186 C 188 190 190 190 192 187" fill="none" stroke="#C87A55" stroke-width="2.5" stroke-linecap="round" />

      <!-- Bochechas Rosadas -->
      <ellipse cx="162" cy="195" rx="6" ry="3.5" fill="#FF8A8A" opacity="0.55" />
      <ellipse cx="210" cy="196" rx="6" ry="3.5" fill="#FF8A8A" opacity="0.55" />

      <!-- Boca Sorridente com Língua -->
      <path d="M 175 198 C 182 214 198 214 204 198 Z" fill="#7F1D1D" stroke="#1F242D" stroke-width="2.5" />
      <!-- Dentes Superiores -->
      <path d="M 178 199 Q 189 203 201 199" fill="#FFFFFF" />
      <!-- Língua Rosada -->
      <path d="M 183 208 C 187 204 194 204 197 208" fill="#F87171" />

      <!-- COROA PRATEADA NA CABEÇA DO MENINO (REI MIRIM) -->
      <g id="head-crown" transform="translate(138, 92) rotate(-14)">
        <path d="M 8 36 L 56 36 L 52 42 L 12 42 Z" fill="url(#silverBorder)" stroke="#1F242D" stroke-width="2" />
        <!-- 5 Pontas da Coroa -->
        <polygon points="8,36 4,14 18,24 32,8 46,24 60,14 56,36" 
                 fill="url(#silverBorder)" stroke="#1F242D" stroke-width="2.5" stroke-linejoin="round" />
        <!-- Esferas no Topo -->
        <circle cx="4" cy="14" r="3" fill="#FFFFFF" stroke="#1F242D" stroke-width="1.5" />
        <circle cx="18" cy="24" r="2.5" fill="#FFFFFF" stroke="#1F242D" stroke-width="1.5" />
        <circle cx="32" cy="8" r="3.5" fill="#FFFFFF" stroke="#1F242D" stroke-width="1.5" />
        <circle cx="46" cy="24" r="2.5" fill="#FFFFFF" stroke="#1F242D" stroke-width="1.5" />
        <circle cx="60" cy="14" r="3" fill="#FFFFFF" stroke="#1F242D" stroke-width="1.5" />
      </g>
    </g>

    <!-- ========================================== -->
    <!-- 3. DETALHES SUPERIORES: 3 ESTRELAS         -->
    <!-- ========================================== -->
    <g id="top-stars">
      <!-- Estrela Central (Maior) -->
      <polygon points="320,154 324,164 335,165 327,172 329,183 320,177 311,183 313,172 305,165 316,164" 
               fill="#FFFFFF" stroke="#1F242D" stroke-width="2" stroke-linejoin="round" />

      <!-- Estrela Esquerda -->
      <polygon points="278,168 281,176 290,177 283,183 285,191 278,186 271,191 273,183 266,177 275,176" 
               fill="#FFFFFF" stroke="#1F242D" stroke-width="1.8" stroke-linejoin="round" />

      <!-- Estrela Direita -->
      <polygon points="362,168 365,176 374,177 367,183 369,191 362,186 355,191 357,183 350,177 359,176" 
               fill="#FFFFFF" stroke="#1F242D" stroke-width="1.8" stroke-linejoin="round" />
    </g>

    <!-- ========================================== -->
    <!-- 4. TIPOGRAFIA 3D: 'IRON' (BRANCO/PRATA)    -->
    <!-- ========================================== -->
    <!-- Camada de Sombra e Contorno Preto Extrudado -->
    <g id="iron-title">
      <!-- Extrusão / Sombra 3D -->
      <text x="348" y="294" 
            font-family="'Montserrat', 'Arial Black', 'Impact', sans-serif" 
            font-size="88" 
            font-weight="900" 
            letter-spacing="3" 
            text-anchor="middle" 
            fill="#0B0D10" 
            stroke="#0B0D10" 
            stroke-width="18" 
            stroke-linejoin="round">IRON</text>

      <!-- Borda Chanfrada Prata Escura -->
      <text x="348" y="290" 
            font-family="'Montserrat', 'Arial Black', 'Impact', sans-serif" 
            font-size="88" 
            font-weight="900" 
            letter-spacing="3" 
            text-anchor="middle" 
            fill="#94A3B8" 
            stroke="#94A3B8" 
            stroke-width="10" 
            stroke-linejoin="round">IRON</text>

      <!-- Face Principal Branco/Platina 3D -->
      <text x="348" y="286" 
            font-family="'Montserrat', 'Arial Black', 'Impact', sans-serif" 
            font-size="88" 
            font-weight="900" 
            letter-spacing="3" 
            text-anchor="middle" 
            fill="url(#ironTextGrad)" 
            stroke="#FFFFFF" 
            stroke-width="2" 
            stroke-linejoin="round">IRON</text>
    </g>

    <!-- ========================================== -->
    <!-- 5. TIPOGRAFIA 3D: 'KIDS' (VERMELHO VIVO)   -->
    <!-- ========================================== -->
    <g id="kids-title">
      <!-- Extrusão / Sombra 3D -->
      <text x="348" y="382" 
            font-family="'Montserrat', 'Arial Black', 'Impact', sans-serif" 
            font-size="94" 
            font-weight="900" 
            letter-spacing="4" 
            text-anchor="middle" 
            fill="#0B0D10" 
            stroke="#0B0D10" 
            stroke-width="18" 
            stroke-linejoin="round">KIDS</text>

      <!-- Borda Vermelha Escura Chanfrada -->
      <text x="348" y="378" 
            font-family="'Montserrat', 'Arial Black', 'Impact', sans-serif" 
            font-size="94" 
            font-weight="900" 
            letter-spacing="4" 
            text-anchor="middle" 
            fill="#7F1D1D" 
            stroke="#7F1D1D" 
            stroke-width="10" 
            stroke-linejoin="round">KIDS</text>

      <!-- Face Principal Vermelho Vivo 3D -->
      <text x="348" y="374" 
            font-family="'Montserrat', 'Arial Black', 'Impact', sans-serif" 
            font-size="94" 
            font-weight="900" 
            letter-spacing="4" 
            text-anchor="middle" 
            fill="url(#kidsTextGrad)" 
            stroke="#FFA3A3" 
            stroke-width="1.5" 
            stroke-linejoin="round">KIDS</text>
    </g>

    <!-- ========================================== -->
    <!-- 6. COROA PRATEADA NA BASE (SOB KIDS)       -->
    <!-- ========================================== -->
    <g id="bottom-crown" transform="translate(320, 436)">
      <!-- Base da Coroa -->
      <path d="M -28 16 L 28 16 L 25 21 L -25 21 Z" fill="url(#silverBorder)" stroke="#0B0D10" stroke-width="1.5" />
      <circle cx="-16" cy="18.5" r="1.5" fill="#FFFFFF" />
      <circle cx="0" cy="18.5" r="1.8" fill="#FFFFFF" />
      <circle cx="16" cy="18.5" r="1.5" fill="#FFFFFF" />

      <!-- 5 Pontas da Coroa -->
      <polygon points="-28,16 -32,2 -16,9 0,-5 16,9 32,2 28,16" 
               fill="url(#silverBorder)" stroke="#0B0D10" stroke-width="2" stroke-linejoin="round" />

      <!-- Esferas nas Pontas -->
      <circle cx="-32" cy="2" r="2.5" fill="#FFFFFF" stroke="#0B0D10" stroke-width="1.2" />
      <circle cx="-16" cy="9" r="2" fill="#FFFFFF" stroke="#0B0D10" stroke-width="1" />
      <circle cx="0" cy="-5" r="3.5" fill="#FFFFFF" stroke="#0B0D10" stroke-width="1.2" />
      <circle cx="16" cy="9" r="2" fill="#FFFFFF" stroke="#0B0D10" stroke-width="1" />
      <circle cx="32" cy="2" r="2.5" fill="#FFFFFF" stroke="#0B0D10" stroke-width="1.2" />
    </g>

  </g>
</svg>